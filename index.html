<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timi AI - Unfiltered</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        h2 { text-align: center; margin: 10px 0; color: #ff4500; }
        #chat { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; background: #181818; border-radius: 8px; margin-bottom: 15px; }
        .input-area { display: flex; gap: 10px; padding-bottom: 20px; }
        input { flex: 1; padding: 15px; background: #222; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; }
        button { padding: 15px 25px; background: #ff4500; color: white; border: none; font-weight: bold; border-radius: 8px; font-size: 16px; }
        p { margin: 10px 0; line-height: 1.4; }
    </style>
</head>
<body>
    <h2>Timi AI: Psychology Strategist</h2>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Ask Timi anything entirely unfiltered...">
        <button onclick="send()">Send</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if(!text) return;
            
            chat.innerHTML += `<p><b>You:</b> ${text}</p>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/timi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                chat.innerHTML += `<p style="color:#00ffcc"><b>Timi:</b> ${data.reply}</p>`;
            } catch (err) {
                chat.innerHTML += `<p style="color:#ff3333"><b>System Error:</b> Connection failed. Try again.</p>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
